### dual_ekf_navsat_zed.yaml
# ──────────────────────────────────────────────────────────────────────
ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame:     map
    odom_frame:    odom
    base_link_frame: base_footprint
    world_frame:   odom

    # Wheel / visual odometry
    odom0: utlidar_odom
    odom0_config: [true, true, true,
                   true,true,true,
                   true, true,  true,
                   false,false,false,
                   false,false,false]
    odom0_queue_size: 5

    odom1: icp_odom
    odom1_config: [false,false,false,
                   false,false,true,
                   false,false,false,
                   false,false,true,
                   false,false,false]

    odom1_differential: false
    odom1_relative:     false

#     # ZED IMU (orientation RP, ang‑vel, lin‑accel)
#     imu0: /imu/data
#     imu0_config: [false,false,false,
#                   true, true, true,
#                   false,false,false,
#                   true, true, true,
#                   true, true, true]
#     imu0_differential: false
#     imu0_relative:     false
#     imu0_queue_size:   5

#     # ZED magnetometer (absolute yaw only)
#     mag0: /zed/zed_node/sensors/magnetometer
#     mag0_config: [false,false,false,
#                   false,false,true,
#                   false,false,false,
#                   false,false,false,
#                   false,false,false]
#     magnetic_declination_radians: -0.106  # Daytona Beach
#     mag0_queue_size: 5

ekf_filter_node_map:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    
    map_frame:   map
    odom_frame:  odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: odometry/local       # output of the first EKF
    odom0_config: [true,true,false,
                   false,false,false,
                   false,false,false,
                   false,false,false,
                   false,false,false]

    odom1: odometry/gps
    odom1_config: [true,true,false,
                   false,false,false,
                   false,false,false,
                   false,false,false,
                   false,false,false]

#     imu0: /imu/data
#     imu0_config: [false,false,false,
#                   false,false,true,
#                   false,false,false,
#                   true, true, true,
#                   true, true, true]

navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: -0.106
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    broadcast_cartesian_transform: true
    broadcast_utm_transform_as_parent_frame: true
    wait_for_datum: true
    use_odometry_yaw: true        # fall‑back if IMU bad
